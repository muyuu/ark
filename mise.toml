# ark のタスクランナ兼ツール定義。`mise tasks` で一覧、`mise run <task>` で実行する。

[tools]
deno = "latest"
rust = "latest"

# --- セットアップ / 運用 ---------------------------------------------------

[tasks.install]
description = "app/ の宣言を適用してパッケージを導入する（brew /(Linux)システム層 /(Windows)winget）"
run = "deno run -A engine/install.ts"

[tasks.audit]
description = "宣言（app/・overlay 含む）に無いのに導入済みのパッケージを棚卸しする（変更はしない）"
run = "deno run -A engine/audit.ts"

[tasks.overlay]
description = "overlay を取得する。`overlay add <git-url>` で登録＋認証＋取得、引数なしで登録済みを取得"
run = "deno run -A engine/overlay-sync.ts"

[tasks.update]
description = "core / overlay を最新化し dotfiles とパッケージを再適用する（変更があったら一発で最新化）"
run = [
  "git pull --ff-only",
  "deno run -A engine/overlay-sync.ts",
  "deno run -A engine/ssh-keys.ts",
  "deno run -A engine/link-dotfiles.ts",
  "deno run -A engine/install.ts",
]

[tasks.github]
description = "このマシンの github.com 用の鍵を用意し GitHub に登録する（gh の認証は事前に済ませておく）"
run = "deno run -A engine/setup-github.ts"

[tasks.ssh-keys]
description = "宣言された SSH 鍵をこのマシンに揃える（生成と ssh config への固定。GitHub 登録はしない）"
run = "deno run -A engine/ssh-keys.ts"

[tasks.security-scan]
description = "ClamAV / rkhunter でセキュリティスキャンを実行する（Linux）"
run = "deno run -A engine/security-scan.ts"

[tasks.register-security-cron]
description = "セキュリティスキャンを @reboot で実行するよう cron 登録する（Linux）"
run = "deno run -A engine/register-security-cron.ts"

[tasks.repo-to-ssh]
description = "カレント git リポジトリの origin を HTTPS から SSH に切り替える"
run = "deno run -A engine/repo-to-ssh.ts"

[tasks.link-dotfiles]
description = "config/ を $HOME へ symlink で展開する"
run = "deno run -A engine/link-dotfiles.ts"

# --- 開発 ------------------------------------------------------------------

[tasks.test]
description = "テストを実行する"
run = "deno test -A"

[tasks.check]
description = "型チェックする"
run = "deno check engine/"

[tasks.fmt]
description = "フォーマットする"
run = "deno fmt"

[tasks.lint]
description = "lint する"
run = "deno lint"
