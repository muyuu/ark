# ark のタスクランナ兼ツール定義。`mise tasks` で一覧、`mise run <task>` で実行する。

[tools]
deno = "latest"
rust = "latest"

# --- セットアップ / 運用 ---------------------------------------------------

[tasks.install]
description = "app/ の宣言を適用してパッケージを導入する（brew /(Linux)システム層 /(Windows)winget）"
run = "deno run -A engine/install.ts"

[tasks.audit]
description = "宣言（app/・overlay 含む）に無いのに導入済みのパッケージを棚卸しする（変更はしない）"
run = "deno run -A engine/audit.ts"

[tasks.overlay]
description = "overlays.toml に登録した private overlay を ghq ツリーへ取得（clone / pull）する"
run = "deno run -A engine/overlay-sync.ts"

[tasks.update]
description = "core / overlay を最新化し dotfiles とパッケージを再適用する（変更があったら一発で最新化）"
run = [
  "git pull --ff-only",
  "deno run -A engine/overlay-sync.ts",
  "deno run -A engine/link-dotfiles.ts",
  "deno run -A engine/install.ts",
]

[tasks.github]
description = "SSH 鍵を生成し GitHub に登録する（gh の認証は事前に済ませておく）"
run = "deno run -A engine/setup-github.ts"

[tasks.repo-to-ssh]
description = "カレント git リポジトリの origin を HTTPS から SSH に切り替える"
run = "deno run -A engine/repo-to-ssh.ts"

[tasks.link-dotfiles]
description = "config/ を $HOME へ symlink で展開する"
run = "deno run -A engine/link-dotfiles.ts"

# --- 開発 ------------------------------------------------------------------

[tasks.test]
description = "テストを実行する"
run = "deno test -A"

[tasks.check]
description = "型チェックする"
run = "deno check engine/"

[tasks.fmt]
description = "フォーマットする"
run = "deno fmt"

[tasks.lint]
description = "lint する"
run = "deno lint"
